<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NFS 2015 - Missões</title>
</head>
<body>

    <!-- ===== TELA DE ABERTURA COM PNEU ===== -->
    <div id="tela-abertura">
        <div class="pneu-container">
            <div class="pneu"></div>
            <p class="loading-text">CARREGANDO...</p>
        </div>
    </div>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <div id="conteudo-principal">

        <h1>🏎️ NFS 2015</h1>

        <!-- ===== MENU COM ABAS (ÂNCORAS) ===== -->
        <div class="menu-abas">
            <a href="#spyke" class="aba spyke-btn">🏁 SPYKE</a>
            <a href="#amy" class="aba amy-btn">🎀 AMY</a>
            <a href="#robyn" class="aba robyn-btn">🔧 ROBYN</a>
        </div>

        <!-- ===== SEÇÃO SPYKE ===== -->
        <div id="spyke" class="secao-missoes spyke">
            <h2>🏁 missões do SPYKE</h2>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/mJEmJdaNc-g" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/DQ6wuSiZPDo" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/QGka_vp_CaY" allowfullscreen></iframe>
            </div>
        </div>

        <!-- ===== SEÇÃO AMY ===== -->
        <div id="amy" class="secao-missoes amy">
            <h2>🎀 missões da Amy</h2>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/2xDGbL9wXXc" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/BQnawnBSw1k" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/MyDglX7dvLQ" allowfullscreen></iframe>
            </div>
        </div>

        <!-- ===== SEÇÃO ROBYN ===== -->
        <div id="robyn" class="secao-missoes robyn">
            <h2>🔧 missões da Robyn</h2>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/VnxkegOiBTs" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/bxbt940tXWc" allowfullscreen></iframe>
                <iframe src="https://www.youtube.com/embed/QEmb4_2-CvY" allowfullscreen></iframe>
            </div>
        </div>

</body>
</html>
